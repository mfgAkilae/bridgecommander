; bcmpfix - multiplayer fixes for Star Trek: Bridge Commander 1.1
; All players should use the same version and the same settings.
; 1 = on, 0 = off. Missing entries use the defaults shown here.

[Fixes]
; Every position update carries the absolute position (instead of deltas to an
; older absolute position). Prevents teleports after lost packets.
AlwaysAbsolutePosition=1
; Receiver: apply deltas relative to the last absolute position instead of
; adding them up (bug in the original; matters for players without the mod).
FixDeltaBase=1
; Newly created network ships are not flung away in their first frame.
FixProxyFirstFrame=1
; A ship that just appeared on your screen (a player joined or respawned) starts at the
; first position received for it. Before, it started where the "object created" message
; had it, which can be seconds old, and slid into place.
SnapNewShips=1
; Also correct small position errors (< 0.5 units) of remote ships.
NoCorrectionDeadband=1
; How fast remote ships are pulled to their network position.
; 100 = original (time constant ~1 s), 500 = ~0.2 s.
CorrectionGainPercent=500
; Never pull a remote ship backwards against its direction of flight faster than half
; its speed: when it is ahead of its network position it slows down instead of
; jumping back (rubber-banding). Large backward errors (a hit knocked the real ship
; back) are still corrected at full speed.
SmoothCorrection=1
; Only with VelocityTracking=0: a hit or an explosion can push a ship sideways or
; backwards while its nose keeps pointing ahead. While that lasts, remote ships follow
; the velocity measured from their received positions instead of their nose (otherwise
; they fall behind by up to 40 units for many seconds).
KnockbackCorrection=1
; Remote ships follow the velocity measured from their received positions, along its
; estimated turn, and are moved exactly by it instead of flying their own path. Without
; it they drift sideways in every turn (about 0.3 units) and their nose lags 30-40
; degrees behind their owner's.
VelocityTracking=1
TrackingArc=1
; Latency compensation correction for VelocityTracking, in ms (advanced).
TrackingLeadOffsetMs=-45
; Turn remote ships to the direction their owner reported. With VelocityTracking=1 they
; follow it fully; without it only when the nose lags more than 30 degrees (fully from 60).
; 0 = off, 1 = on, 2 = experimental: with a predicted turn, 3 = always.
OrientationCorrection=1
; Experimental (worse in tests, see docs/measurements.md): extrapolate remote ships
; along the velocity estimated from received positions (1 straight, 2 curved), and,
; with OrientationCorrection=2, along the predicted turn (ArcExtrapolation=1).
VelocityExtrapolation=0
ArcExtrapolation=1
; Interval of position updates per ship and player at close range (original 100).
StateUpdateIntervalMs=50
; The game sends fewer position updates for distant ships: half as many from 170
; units, a fifth from 228, one per second from 343. These distances are multiplied
; by this percentage (100 = original). 300 doubles the host's upload (about 25 kB/s
; with six players) and keeps ships at fighting range accurate.
UpdateDistanceScalePercent=300
; Resend interval for lost guaranteed messages (fire commands, deaths, ...).
; Original 1000 ms; one lost packet blocks all following messages that long.
ResendIntervalMs=300
; Game clock relative to program start instead of Windows start (otherwise
; frame timing degrades with long uptime, also because of Windows Fast Startup).
ClockFromProcessStart=1
; Windows timer resolution 1 ms.
TimerResolution1ms=1
; Script layer scripts\bcmpfix_mp.py (required for the next two options).
ScriptLayer=1
; The host decides torpedo hits; all players see the same hits.
; Only takes effect when the host runs bcmpfix too (detected automatically).
TorpedoHitAuthority=1
; With TorpedoHitAuthority: show a torpedo hit at once when your copy of the torpedo
; hits, instead of waiting for the host's report (about 0.15 s). The host's report
; confirms it; only hits you did not see yourself are replayed from the report.
PredictTorpedoHits=1
; Torpedoes fired by another player start on your PC one network latency late. Move
; them ahead by that latency, so they hit when the shooter's do. 1 = on the clients,
; 2 = also on the host (the host's copy then sometimes decides shield or hull
; differently from the shooter's), 0 = off.
TorpedoLatencyCompensation=1
; Another player's phaser beams fire, and hit, on your PC when they do on that player's
; PC (it reports its firing banks and their hits). Without it, each PC decides on its
; own, and about 15 % of the beams differed, also for the host's damage.
PhaserHitAuthority=1
; With PhaserHitAuthority: send these phaser reports also straight to every other player
; who runs bcmpfix (UDP on the game's port), not only through the host. A client's
; beams then start one network latency earlier on the other clients. The other players
; learn your IP address and port from the host for this. 0 = only through the host.
DirectPhaserReports=1
; Remote ships are extrapolated by the measured network latency.
LatencyCompensation=1
MaxLatencyCompensationMs=300
; Host: send the other players' ships from their last received (and extrapolated)
; position instead of the host's smoothed copy. Matters with three or more players.
HostRelayReceivedState=1
; A player who joins while another player spawns a ship could miss that ship for the
; whole game (it existed on their PC but was never shown). Fixed when the host sends it
; again during the join.
FixGhostShip=1
; Dedicated server: the original numbers the server's own objects (torpedo copies) in the
; first player's range, so a ship that player creates can be refused by the server and
; stay invisible for everybody. The server then uses a range no player gets.
FixDedicatedObjectIds=1
; The original's range condition (used by the combat music) adds its event handlers again
; whenever its group of ships changes, so their number doubled with every join, death and
; respawn. With many players the game then stalled for seconds whenever objects were
; deleted (issue #27). Registers them once.
FixConditionInRange=1
; Torpedo fire messages: the original swaps the "launch sound" and "launch sideways"
; flags between sender and receiver, so other players saw torpedoes leave the tube
; sideways and heard no launch sound. Fixed on the sender (works for all receivers).
FixTorpedoFireFlags=1
; Torpedoes fired by another player are created on your PC from a fire message. The
; original gives them there 1.5x the turn rate and 1.25x the guidance time, and re-aims
; disruptor shots at the intercept point as your PC predicts it. Their path then differs
; from the shooter's, also on the host, which decides the hits. Keep the shooter's values.
SymmetricTorpedoSpawn=1
; Script errors: write them to bcmpfix.log and keep the game running. Without this, the
; game freezes in windowed mode on any script error ("TG Python Exception Debug Console").
NoScriptErrorConsole=1
; Optional frame rate limit (0 = off). Can lower CPU load at very high FPS.
MaxFPS=0
; Ignore mouse/keyboard input while the game window is not in the foreground.
InputOnlyWhenFocused=0
; Diagnostics only: extra limit of send rounds per second (0 = off).
StateUpdateHz=0

[Test]
; Internal test mode (automated games). Always 0 for normal play.
Enabled=0

[Debug]
; Network statistics every N seconds in bcmpfix.log (0 = off).
NetStatsSec=0
; More detailed log.
Verbose=0
; Diagnostics: log every received ship state update and every position correction
; for N seconds into bcmpfix_trace.log (0 = off).
TraceStateSec=0
